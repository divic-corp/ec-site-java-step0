name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

# Superseded PR candidates may stop; independent manual/push runs keep their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event_name == 'pull_request' && 'latest' || github.run_attempt }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify CI artifact boundary
        run: node --test scripts/ci-artifact.test.mjs

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean verify --batch-mode --no-transfer-progress

      - name: Upload JAR artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: ec-site-jar
          path: target/*.jar
          retention-days: 1

      - name: Bind deployment JAR to this successful CI
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        id: jar
        run: node scripts/ci-artifact.mjs prepare

      - name: Upload verified deployment JAR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.jar.outputs.artifact-name }}
          path: ci-deploy-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
